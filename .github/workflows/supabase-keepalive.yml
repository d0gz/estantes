name: Supabase keepalive

# Projetos gratuitos do Supabase pausam após 7 dias sem uso.
# Este workflow faz uma consulta leve toda segunda e quinta-feira.
# Configure em Settings → Secrets and variables → Actions:
#   SUPABASE_URL              (ex.: https://xxxx.supabase.co)
#   SUPABASE_PUBLISHABLE_KEY  (sb_publishable_...; a leitura de lexml_livros é pública pelo RLS)
# A chave publicável não é um JWT: vai só no cabeçalho apikey, nunca em "Authorization: Bearer".
# Atenção: o GitHub desativa workflows agendados após 60 dias sem commits no repositório.
on:
  schedule:
    - cron: "17 12 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar o banco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Secrets SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY não configurados; o projeto vai pausar."
            exit 1
          fi
          curl -fsS "$SUPABASE_URL/rest/v1/lexml_livros?select=lexml_id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY"
          echo
          echo "Supabase respondeu."
